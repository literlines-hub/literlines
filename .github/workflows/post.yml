name: instagram-post
on:
  schedule:
    - cron: "5 * * * *"      # 매시간 5분 (한국 시간 기준 매시 05분)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 예약된 게시물 올리기
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python post_instagram.py
      - name: 게시 기록 저장
        run: |
          git config user.name "auto-poster"; git config user.email "auto-poster@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (git commit -m "게시 기록 업데이트" && git push)
